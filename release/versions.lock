# Pinned sources for a noevia release (ADR 0001, docs/adr-0001-rust-and-repo-split.md).
# One KEY=<40-character commit SHA> per line; '#' starts a comment. The server never clones:
# images fetch each pinned repo as an anonymous https tarball and verify its checksum.
#
# NOEVIA_WEB_REF / NOEVIA_CORE_REF: sbstndalton/noevia-web and sbstndalton/noevia-core, read by
# deploy/tools/assemble-release.sh from the lock AT THE RELEASED noevia SHA (#922). Until those
# repos are extracted they hold the literal `self`: "this noevia checkout's SHA", i.e. web/ and
# core/ are exported from apps/web at the same commit. A 40-character SHA instead fetches
# https://codeload.github.com/sbstndalton/noevia-{web,core}/tar.gz/<ref>; the optional
# NOEVIA_WEB_SHA256 / NOEVIA_CORE_SHA256 keys pin that tarball's checksum.
#
# NOEVIA_RS_REF: sbstndalton/noevia-rs, built into the model-manager image as gguf-meta
# (#909). Bumping it also means updating NOEVIA_RS_REF and NOEVIA_RS_SHA256 in
# services/model-manager/Dockerfile (CI fails if the Dockerfile default differs from this file).
NOEVIA_RS_REF=751c2d71868e782de33558cf00f805cc74758ecb
NOEVIA_WEB_REF=self
NOEVIA_CORE_REF=self

# Pinned sources for a noevia release (ADR 0001, docs/adr-0001-rust-and-repo-split.md).
# One KEY=<value> per line; '#' starts a comment. The server never clones: releases fetch each
# pinned repo as an anonymous https tarball and verify its checksum.
#
# Since the repo split cutover (#952, docs/repo-split-cutover.md) the web client, the server and
# the sidecars live in their own repos, and a release is assembled from these pins by
# deploy/tools/assemble-release.sh, which reads this file AS COMMITTED AT THE RELEASED noevia SHA:
#   NOEVIA_WEB_REF       sbstndalton/noevia-web       -> web/       (client)
#   NOEVIA_CORE_REF      sbstndalton/noevia-core      -> core/      (server, contracts, code-sandbox)
#   NOEVIA_SERVICES_REF  sbstndalton/noevia-services  -> services/  (diary, docling, laya,
#                                                                    model-manager, ocr)
# Each is a 40-character commit SHA, fetched from
# https://codeload.github.com/sbstndalton/<repo>/tar.gz/<ref>; the REQUIRED <KEY>_SHA256 pins that
# tarball's checksum (`curl -fsSL <url> | shasum -a 256`). `self` (export from this checkout) only
# works at commits from before the cutover, which still have apps/web and services/.
# Every pinned ref (web, core, services, rs) must be reachable from its repo's main (CI checks).
# To ship a change made in one of those repos, bump its _REF and _SHA256 here in a PR; CI
# ("Assembled release") assembles from this file, builds the web image and boots it.
# Per-service image tags (DIARY_VERSION, OCR_VERSION, ...) keep their meaning.
#
# NOEVIA_RS_REF: sbstndalton/noevia-rs, built into the model-manager image as gguf-meta and
# model-files, into the ocr image as docx-text, into the diary image as tenant-assertion and
# workspace-restore-verify (#982; both also built by deploy/examples/diary-overlay.sh from the
# diary Dockerfile's pin), and into the dark
# egress-rs image (#909, #964, #981, #926). Bumping it also means updating NOEVIA_RS_REF and
# NOEVIA_RS_SHA256 in deploy/egress-proxy/Dockerfile and in noevia-services' model-manager/,
# ocr/, diary/, docling/ and laya/Dockerfile (CI fails if any Dockerfile default differs).
# NOEVIA_RS_SHA256 (M1) is that ref's tarball checksum, the same value as the Dockerfiles'
# ARG NOEVIA_RS_SHA256 (CI checks): assemble-release.sh fetches noevia-rs into the release tree's
# rs/, and build/web.Dockerfile builds the Rust front (bins/noevia-server, NOEVIA_FRONT=rust) from
# it. A ref from before bins/noevia-server builds a web image without the front.

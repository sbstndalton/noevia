# Pinned sources for a noevia release (ADR 0001, docs/adr-0001-rust-and-repo-split.md).
# One KEY=<40-character commit SHA> per line; '#' starts a comment. The server never clones:
# images fetch each pinned repo as an anonymous https tarball and verify its checksum.
#
# NOEVIA_WEB_REF / NOEVIA_CORE_REF: sbstndalton/noevia-web and sbstndalton/noevia-core, read by
# deploy/tools/assemble-release.sh from the lock AT THE RELEASED noevia SHA (#922). Until those
# repos are extracted they hold the literal `self`: "this noevia checkout's SHA", i.e. web/ and
# core/ are exported from apps/web at the same commit. A 40-character SHA instead fetches
# https://codeload.github.com/sbstndalton/noevia-{web,core}/tar.gz/<ref>; the REQUIRED
# NOEVIA_WEB_SHA256 / NOEVIA_CORE_SHA256 keys pin that tarball's checksum.
#
# NOEVIA_SERVICES_REF: sbstndalton/noevia-services (the Python sidecars: diary, docling, laya,
# model-manager, ocr; #952). Same rules: `self` exports services/ from this checkout, a 40-char SHA
# fetches the codeload tarball, required NOEVIA_SERVICES_SHA256 pins its checksum. Per-service image
# tags (DIARY_VERSION, OCR_VERSION, ...) keep their meaning. The candidate SHAs extracted for the
# cutover live in release/split-candidate.lock (CI only); see docs/repo-split-cutover.md.
#
# NOEVIA_RS_REF: sbstndalton/noevia-rs, built into the model-manager image as gguf-meta and into
# the dark egress-rs image (#909, #926). Bumping it also means updating NOEVIA_RS_REF and
# NOEVIA_RS_SHA256 in deploy/egress-proxy/Dockerfile and
# services/model-manager/Dockerfile (CI fails if the Dockerfile default differs from this file).
NOEVIA_RS_REF=3a9deac0279c5d05c6668565e1b46750d795d28b
NOEVIA_WEB_REF=self
NOEVIA_CORE_REF=self
NOEVIA_SERVICES_REF=self

# Optional direct native-router overlay; this does not modify a running deployment.
# docker compose -f compose.yaml -f compose.llamacpp.yaml config --quiet
# Mount DIRECTORY paths so atomic preset renames reach both services.
services:
  llama:
    image: ghcr.io/ggml-org/llama.cpp:server-vulkan@sha256:94bd70ef60ef6d670c85999c144f59013e06525d9ee26b3563ab9b2f29d1ea41
    restart: unless-stopped
    command: ["--models-preset", "/config/models.ini", "--host", "0.0.0.0", "--port", "8080", "--models-max", "1", "--metrics"]
    devices:
      - ${LLAMACPP_RENDER_DEVICE:?Set the qualified render device}:${LLAMACPP_RENDER_DEVICE}
      - ${LLAMACPP_CARD_DEVICE:?Set the qualified card device}:${LLAMACPP_CARD_DEVICE}
    volumes:
      - ${LLAMACPP_MODELS_DIR:?Set the existing public models directory}:/models:ro
      - ${LLAMACPP_CONFIG_DIR:?Set the qualified preset directory}:/config:ro
      - ${LLAMACPP_CACHE_DIR:?Set a dedicated writable native cache}:/cache
    environment:
      LLAMA_CACHE: /cache
    mem_limit: ${LLAMACPP_MEMORY_LIMIT:-14g}
    memswap_limit: ${LLAMACPP_MEMORY_LIMIT:-14g}
    # Default for web and Diary inference; models so the model manager can reach it.
    networks: [default, models]
    # No published ports; model administration stays on the Compose network.
  # Model manager (Model Loader by scratchhax, MIT, folded into services/model-manager):
  # downloads, the models.ini editor, autoconfig, telemetry, benchmarks and backend
  # restarts. It has no login and holds the Docker socket, so it publishes no port;
  # noevia's Settings → Models & routing drives its JSON API for administrators.
  model-loader:
    build:
      context: ${COWORK_SOURCE_DIR:-.}/services/model-manager
    image: cowork-model-loader:${MODEL_MANAGER_VERSION:?Set MODEL_MANAGER_VERSION to the built model manager image tag}
    restart: unless-stopped
    environment:
      MODELS_DIR: /models
      MODELS_HOST_PATH: ${LLAMACPP_MODELS_DIR}
      MODELS_INI_PATH: /config/models.ini
      DATA_DIR: /data
      LLAMA_CONTAINERS: ${MODEL_LOADER_LLAMA_CONTAINERS:-}
      GPU_VRAM: ${MODEL_LOADER_GPU_VRAM:-}
      HOST_RAM_RESERVE_GB: ${MODEL_LOADER_HOST_RAM_RESERVE_GB:-8}
      # Required: this service holds the Docker socket; only web knows this secret.
      MODEL_LOADER_TOKEN: ${MODEL_LOADER_TOKEN:?Set a random MODEL_LOADER_TOKEN (e.g. openssl rand -hex 32)}
    volumes:
      - ${LLAMACPP_MODELS_DIR}:/models
      - ${LLAMACPP_CONFIG_DIR}:/config
      - ${MODEL_LOADER_DATA_DIR:?Set a writable Model Loader data directory}:/data
      - /var/run/docker.sock:/var/run/docker.sock
    mem_limit: 512m
    # Not on the default network: the Diary sidecar must not reach a Docker-socket holder.
    networks: [models]

  web:
    networks: [models]
    environment:
      INFERENCE_BASE_URL: http://llama:8080/v1
      MODEL_MANAGER_KIND: llamacpp
      MODEL_MANAGER_BASE_URL: http://llama:8080
      LLAMACPP_PRESET_PATH: /llamacpp-config/models.ini
      EMBEDDING_MODEL: ${LLAMACPP_EMBED_MODEL:?Set an installed native embedding identity}
      # Preset suggestions read model file headers read-only and size against this limit.
      LLAMACPP_MODELS_PATH: /models
      LLAMACPP_MEMORY_LIMIT: ${LLAMACPP_MEMORY_LIMIT:-14g}
      LLAMACPP_CACHE_PATH: /cache
      # Calibration stops a step when host available memory falls below this.
      LLAMACPP_CALIBRATION_MEMORY_FLOOR_GIB: ${LLAMACPP_CALIBRATION_MEMORY_FLOOR_GIB:-4}
      MODEL_LOADER_URL: http://model-loader:8090
      MODEL_LOADER_TOKEN: ${MODEL_LOADER_TOKEN}
    volumes:
      - ${LLAMACPP_CONFIG_DIR}:/llamacpp-config
      - ${LLAMACPP_MODELS_DIR}:/models:ro
      - ${LLAMACPP_CACHE_DIR}:/cache:ro
  diary:
    environment:
      LLM_BASE_URL: http://llama:8080/v1
      LLM_CHAT_MODEL: ${LLAMACPP_CHAT_MODEL:?Set an installed native chat identity}
      LLM_EMBED_MODEL: ${LLAMACPP_EMBED_MODEL}
      LLM_AUX_BASE_URL: http://llama:8080/v1
      LLM_AUX_MODEL: ${LLAMACPP_AUX_MODEL:?Set an installed native auxiliary identity}

networks:
  # Web, the engine and the model manager only. The Diary sidecar is not attached.
  models: {}

name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# Since the repo split cutover (#952) the client, server and sidecar tests and image builds run in
# sbstndalton/noevia-web, noevia-core and noevia-services. This repo is the integration repo: it
# checks the deploy tooling, and assembles a release from the SHAs pinned in
# release/versions.lock, builds the web image from it and boots it.
jobs:
  # Path filter. Every job below still runs (so its check name always reports), but when its
  # filter is false it only runs a no-op step and succeeds.
  changes:
    name: Detect changed areas
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      deploy: ${{ steps.filter.outputs.deploy == 'true' || steps.filter.outputs.ci == 'true' }}
      assembly: ${{ steps.filter.outputs.assembly == 'true' || steps.filter.outputs.ci == 'true' }}
      split: ${{ steps.filter.outputs.split == 'true' || steps.filter.outputs.ci == 'true' }}
    steps:
      - uses: actions/checkout@v4
      # The macOS client moved to its own repo (#900). Stop it creeping back in here.
      - name: Guard against a re-added macOS client
        run: |
          if [ -e clients/macos ]; then
            echo "::error::clients/macos/ must not exist in this repo. The macOS client lives in https://github.com/sbstndalton/noevia-macos (#900); make the change there."
            exit 1
          fi
      # The repo split (#952): the client, server and sidecars live in their own repos. This covers
      # all of apps/web, so the retired apps/web/Dockerfile cannot return either.
      - name: Guard against re-added split paths
        run: |
          for p in apps/web services/diary services/docling services/laya services/model-manager services/ocr services/code-sandbox; do
            if [ -e "$p" ]; then
              echo "::error::$p/ must not exist in this repo. It lives in noevia-web, noevia-core or noevia-services (#952); make the change there."
              exit 1
            fi
          done
      - uses: dorny/paths-filter@de90cc6fb38fc0963ad72b210f1f284cd68cea36 # v3.0.2
        id: filter
        with:
          filters: |
            deploy:
              - 'compose.yaml'
              - 'compose.*.yaml'
              - '.env.example'
              - 'Makefile'
              - 'deploy/**'
              - 'build/**'
              - 'docs/deployment.md'
              - 'release/versions.lock'
            assembly:
              - 'deploy/**'
              - 'build/**'
              - 'release/**'
              - 'compose.yaml'
              - 'compose.*.yaml'
              - '.env.example'
            split:
              - 'tools/repo-split/**'
            # A change to CI itself runs every job.
            ci:
              - '.github/workflows/**'

  deploy-tests:
    name: Deploy tooling shell/wrapper tests
    needs: changes
    runs-on: ubuntu-latest
    env:
      RUN_JOB: ${{ needs.changes.outputs.deploy }}
    steps:
      - name: Skip (no relevant changes)
        if: env.RUN_JOB != 'true'
        run: echo "No deploy changes; skipping."
      - uses: actions/checkout@v4
        if: env.RUN_JOB == 'true'
      # php-cli: deploy/preflight/test_check.php. rclone (flock is part of util-linux):
      # deploy/tests/test_rclone_sync.py, which skips itself without both and would otherwise
      # pass here without running a single case.
      - name: Install php-cli and rclone
        if: env.RUN_JOB == 'true'
        run: sudo apt-get update && sudo apt-get install -y php-cli rclone
      - run: python3 deploy/preflight/test_wrapper.py
        if: env.RUN_JOB == 'true'
      - run: php deploy/preflight/test_check.php
        if: env.RUN_JOB == 'true'
      - run: python3 deploy/nextcloud/test_repair_push.py
        if: env.RUN_JOB == 'true'
      # test_init_managed (the fresh-install initializer), test_overlay_replacement (guards the
      # `rm -rf` inside overlay-release.sh), test_overlay_scripts, test_rclone_sync.
      - run: python3 -m unittest discover -v -s deploy/tests -p 'test_*.py'
        if: env.RUN_JOB == 'true'
      - run: bash deploy/tools/test-build-web-release.sh
        if: env.RUN_JOB == 'true'
      - run: bash deploy/tools/test-assemble-release.sh
        if: env.RUN_JOB == 'true'
      - run: bash deploy/tools/test-sidecar-restart-alert.sh
        if: env.RUN_JOB == 'true'
      # Every Compose file the repo ships must still parse (no containers are started).
      - run: make compose-check
        if: env.RUN_JOB == 'true'
      # #926: the dark Rust egress proxy image builds from release/versions.lock's NOEVIA_RS_REF;
      # the Dockerfile default must match the lock. (The model-manager Dockerfile, which pins the
      # same ref and checksum, lives in noevia-services; "Assembled release" checks it.)
      # #964 F2: every pinned SHA must be reachable from its repo's main, so a release never
      # builds from an unmerged PR head or a force-pushed-away commit.
      - name: Pinned refs are on each repo's main
        if: env.RUN_JOB == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          for pair in noevia-web:NOEVIA_WEB_REF noevia-core:NOEVIA_CORE_REF noevia-services:NOEVIA_SERVICES_REF noevia-rs:NOEVIA_RS_REF; do
            repo=${pair%%:*}; key=${pair#*:}
            ref=$(sed -n "s/^${key}=//p" release/versions.lock)
            [[ "$ref" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::$key is not a 40-char SHA"; exit 1; }
            status=""
            for attempt in 1 2 3 4 5; do
              status=$(gh api "repos/sbstndalton/$repo/compare/$ref...main" --jq .status 2>/dev/null) && break
              sleep $((attempt * 5))
            done
            echo "$key $ref: main is '$status'"
            case "$status" in
              identical|ahead) ;;
              *) echo "::error::$key $ref is not reachable from sbstndalton/$repo main (compare status '$status')"; exit 1 ;;
            esac
          done
      - name: egress-rs Dockerfile pin matches the lock
        if: env.RUN_JOB == 'true'
        run: |
          set -euo pipefail
          ref=$(sed -n 's/^NOEVIA_RS_REF=//p' release/versions.lock)
          [[ "$ref" =~ ^[0-9a-f]{40}$ ]] || { echo "NOEVIA_RS_REF in release/versions.lock is not a 40-char SHA"; exit 1; }
          df_ref=$(sed -n 's/^ARG NOEVIA_RS_REF=//p' deploy/egress-proxy/Dockerfile)
          [ "$df_ref" = "$ref" ] || { echo "deploy/egress-proxy/Dockerfile NOEVIA_RS_REF ($df_ref) != versions.lock ($ref)"; exit 1; }
          grep -q "CODE_EGRESS_IMPL: \${CODE_EGRESS_IMPL:-node}" deploy/examples/code-egress-rust.override.yml \
            || { echo "code-egress-rust.override.yml must default CODE_EGRESS_IMPL to node"; exit 1; }
          # The proxy binds CODE_EGRESS_BIND: it must be an alias that exists on `code` only (a
          # service name resolves on every network, possibly to the `default` address first), and
          # web must hand tasks that same name.
          cfg=$(docker compose --env-file .env.example --profile code -f compose.yaml \
            -f deploy/examples/code-sandbox.override.yml -f deploy/examples/code-egress-rust.override.yml config --format json)
          bind=$(jq -r '.services["egress-rs"].environment.CODE_EGRESS_BIND' <<<"$cfg")
          [ "$bind" != "egress-rs" ] || { echo "CODE_EGRESS_BIND must not be the service name"; exit 1; }
          jq -e --arg b "$bind" '.services["egress-rs"].networks.code.aliases | index($b) != null' <<<"$cfg" >/dev/null \
            || { echo "CODE_EGRESS_BIND ($bind) is not an alias on the code network"; exit 1; }
          jq -e --arg b "$bind" '[.services[] | .networks // {} | to_entries[] | select(.key != "code") | .value.aliases // [] | index($b)] | all(. == null)' <<<"$cfg" >/dev/null \
            || { echo "alias $bind must exist on the code network only"; exit 1; }
          [ "$(jq -r '.services.web.environment.CODE_EGRESS_RUST_HOST' <<<"$cfg")" = "$bind" ] \
            || { echo "web CODE_EGRESS_RUST_HOST must equal the proxy's code-only alias"; exit 1; }
          [ "$(jq -r '.networks.code.internal' <<<"$cfg")" = "true" ] || { echo "code network must be internal"; exit 1; }
          jq -e '.services["egress-rs"].ports == null' <<<"$cfg" >/dev/null || { echo "egress-rs must publish no ports"; exit 1; }
      - name: Build egress-rs image
        if: env.RUN_JOB == 'true'
        run: |
          set -euo pipefail
          docker build -t noevia-egress-rs:ci deploy/egress-proxy
          # Refuses to start without grants or a key (exit 2), proving the binary runs on the base.
          set +e; docker run --rm noevia-egress-rs:ci > /tmp/egress.out 2>&1; code=$?; set -e
          cat /tmp/egress.out
          [ "$code" = 2 ] && grep -q "no grants" /tmp/egress.out

  # The release path (#922, #952), end to end at this commit: assemble the release tarball from the
  # repos pinned in release/versions.lock (assemble-release.sh, exactly as a release does), check
  # the tree and the Compose build contexts that point into it, build the web image with
  # build-web-release.sh (the script the server runs) and boot it.
  #
  # Until the cutover this job also compared the assembled image with apps/web/Dockerfile's. That
  # comparison retired with apps/web/: its last run, at the cut sha, is linked from the cutover PR.
  assembled-release:
    name: Assembled release (pinned repos)
    needs: changes
    runs-on: ubuntu-latest
    env:
      RUN_JOB: ${{ needs.changes.outputs.assembly }}
    steps:
      - name: Skip (no relevant changes)
        if: env.RUN_JOB != 'true'
        run: echo "No release-assembly changes; skipping."
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        if: env.RUN_JOB == 'true'
      - name: Assemble release tarball from release/versions.lock
        if: env.RUN_JOB == 'true'
        id: assemble
        run: |
          set -euo pipefail
          lock=release/versions.lock
          for k in WEB CORE SERVICES; do
            ref=$(sed -n "s/^NOEVIA_${k}_REF=//p" "$lock"); sum=$(sed -n "s/^NOEVIA_${k}_SHA256=//p" "$lock")
            [[ "$ref" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::NOEVIA_${k}_REF must be a pinned 40-char sha after the repo split, got '$ref'"; exit 1; }
            [[ "$sum" =~ ^[0-9a-f]{64}$ ]] || { echo "::error::NOEVIA_${k}_SHA256 is missing"; exit 1; }
            echo "${k,,}_ref=$ref" >> "$GITHUB_OUTPUT"
          done
          sha=$(git rev-parse HEAD)
          a="$RUNNER_TEMP/assembled"; mkdir -p "$a/tree"
          bash deploy/tools/assemble-release.sh "$sha" "$a"
          tar -xzf "$a/noevia-release-$sha.tar.gz" -C "$a/tree"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "tree=$a/tree" >> "$GITHUB_OUTPUT"
      - name: Tree matches the lock; sidecar contexts and the model-manager and ocr pins
        if: env.RUN_JOB == 'true'
        env:
          TREE: ${{ steps.assemble.outputs.tree }}
          SHA: ${{ steps.assemble.outputs.sha }}
          WEB_REF: ${{ steps.assemble.outputs.web_ref }}
          CORE_REF: ${{ steps.assemble.outputs.core_ref }}
          SERVICES_REF: ${{ steps.assemble.outputs.services_ref }}
        run: |
          set -euo pipefail
          cat "$TREE/release-refs"
          printf 'NOEVIA_SHA=%s\nNOEVIA_WEB_SHA=%s\nNOEVIA_CORE_SHA=%s\nNOEVIA_SERVICES_SHA=%s\n' "$SHA" "$WEB_REF" "$CORE_REF" "$SERVICES_REF" \
            | diff - "$TREE/release-refs"
          for svc in diary docling laya model-manager ocr; do
            [ -f "$TREE/services/$svc/Dockerfile" ] || { echo "::error::services/$svc build context missing"; exit 1; }
          done
          [ -f "$TREE/core/code-sandbox/Dockerfile" ] || { echo "::error::core/code-sandbox build context missing"; exit 1; }
          # model-manager builds gguf-meta from noevia-rs with the same pin as the egress proxy.
          ref=$(sed -n 's/^NOEVIA_RS_REF=//p' release/versions.lock)
          mm="$TREE/services/model-manager/Dockerfile"
          [ "$(sed -n 's/^ARG NOEVIA_RS_REF=//p' "$mm")" = "$ref" ] \
            || { echo "::error::noevia-services model-manager/Dockerfile NOEVIA_RS_REF != release/versions.lock ($ref)"; exit 1; }
          [ "$(sed -n 's/^ARG NOEVIA_RS_SHA256=//p' "$mm")" = "$(sed -n 's/^ARG NOEVIA_RS_SHA256=//p' deploy/egress-proxy/Dockerfile)" ] \
            || { echo "::error::NOEVIA_RS_SHA256 differs between egress-proxy and model-manager Dockerfiles"; exit 1; }
          # #981: the OCR image builds docx-text from the same noevia-rs pin.
          ocr="$TREE/services/ocr/Dockerfile"
          [ "$(sed -n 's/^ARG NOEVIA_RS_REF=//p' "$ocr")" = "$ref" ] \
            || { echo "::error::noevia-services ocr/Dockerfile NOEVIA_RS_REF != release/versions.lock ($ref)"; exit 1; }
          [ "$(sed -n 's/^ARG NOEVIA_RS_SHA256=//p' "$ocr")" = "$(sed -n 's/^ARG NOEVIA_RS_SHA256=//p' deploy/egress-proxy/Dockerfile)" ] \
            || { echo "::error::NOEVIA_RS_SHA256 differs between egress-proxy and ocr Dockerfiles"; exit 1; }
          # The diary image (and diary-overlay.sh, which reads this Dockerfile's pins) builds
          # tenant-assertion from the same noevia-rs pin.
          diary="$TREE/services/diary/Dockerfile"
          [ "$(sed -n 's/^ARG NOEVIA_RS_REF=//p' "$diary")" = "$ref" ] \
            || { echo "::error::noevia-services diary/Dockerfile NOEVIA_RS_REF != release/versions.lock ($ref)"; exit 1; }
          [ "$(sed -n 's/^ARG NOEVIA_RS_SHA256=//p' "$diary")" = "$(sed -n 's/^ARG NOEVIA_RS_SHA256=//p' deploy/egress-proxy/Dockerfile)" ] \
            || { echo "::error::NOEVIA_RS_SHA256 differs between egress-proxy and diary Dockerfiles"; exit 1; }
      # #967: core pins its own noevia-rs ref for dav-parse.wasm (core/server/dav-parse.lock). Like
      # every lock pin, it must be on noevia-rs main before a release ships it.
      - name: core's dav-parse noevia-rs pin is on noevia-rs main
        if: env.RUN_JOB == 'true'
        env:
          TREE: ${{ steps.assemble.outputs.tree }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          lock="$TREE/core/server/dav-parse.lock"
          [ -f "$lock" ] || { echo "::error::core/server/dav-parse.lock missing from the assembled tree"; exit 1; }
          ref=$(sed -n 's/^NOEVIA_RS_REF=//p' "$lock")
          [[ "$ref" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::dav-parse.lock NOEVIA_RS_REF is not a 40-char SHA"; exit 1; }
          for k in NOEVIA_RS_SHA256 DAV_PARSE_WASM_SHA256; do
            [[ "$(sed -n "s/^$k=//p" "$lock")" =~ ^[0-9a-f]{64}$ ]] || { echo "::error::dav-parse.lock $k is not a sha256"; exit 1; }
          done
          status=""
          for attempt in 1 2 3 4 5; do
            status=$(gh api "repos/sbstndalton/noevia-rs/compare/$ref...main" --jq .status 2>/dev/null) && break
            sleep $((attempt * 5))
          done
          echo "dav-parse NOEVIA_RS_REF $ref: main is '$status'"
          case "$status" in
            identical|ahead) ;;
            *) echo "::error::dav-parse.lock NOEVIA_RS_REF $ref is not reachable from sbstndalton/noevia-rs main (compare status '$status')"; exit 1 ;;
          esac
      # #999: core pins a second noevia-rs ref, for the code-sandbox image's sandbox-bridge.wasm
      # (core/code-sandbox/sandbox-bridge.lock). Same rule: on noevia-rs main before a release ships it.
      - name: core's sandbox-bridge noevia-rs pin is on noevia-rs main
        if: env.RUN_JOB == 'true'
        env:
          TREE: ${{ steps.assemble.outputs.tree }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          lock="$TREE/core/code-sandbox/sandbox-bridge.lock"
          [ -f "$lock" ] || { echo "::error::core/code-sandbox/sandbox-bridge.lock missing from the assembled tree"; exit 1; }
          ref=$(sed -n 's/^NOEVIA_RS_REF=//p' "$lock")
          [[ "$ref" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::sandbox-bridge.lock NOEVIA_RS_REF is not a 40-char SHA"; exit 1; }
          for k in NOEVIA_RS_SHA256 SANDBOX_BRIDGE_WASM_SHA256; do
            [[ "$(sed -n "s/^$k=//p" "$lock")" =~ ^[0-9a-f]{64}$ ]] || { echo "::error::sandbox-bridge.lock $k is not a sha256"; exit 1; }
          done
          status=""
          for attempt in 1 2 3 4 5; do
            status=$(gh api "repos/sbstndalton/noevia-rs/compare/$ref...main" --jq .status 2>/dev/null) && break
            sleep $((attempt * 5))
          done
          echo "sandbox-bridge NOEVIA_RS_REF $ref: main is '$status'"
          case "$status" in
            identical|ahead) ;;
            *) echo "::error::sandbox-bridge.lock NOEVIA_RS_REF $ref is not reachable from sbstndalton/noevia-rs main (compare status '$status')"; exit 1 ;;
          esac
      # The repo's Compose files, run from the tree's noevia/ with COWORK_SOURCE_DIR unset (default
      # `..`) and set (as on the server), must point every build at a context in the tree.
      - name: Compose build contexts resolve inside the assembled tree
        if: env.RUN_JOB == 'true'
        env:
          TREE: ${{ steps.assemble.outputs.tree }}
        working-directory: ${{ steps.assemble.outputs.tree }}/noevia
        run: |
          set -euo pipefail
          stubs=(LLAMACPP_RENDER_DEVICE=/dev/dri/renderD128 LLAMACPP_CARD_DEVICE=/dev/dri/card0 LLAMACPP_MODELS_DIR=/stub/models
            LLAMACPP_CONFIG_DIR=/stub/config LLAMACPP_CACHE_DIR=/stub/cache LLAMACPP_CHAT_MODEL=stub-chat LLAMACPP_AUX_MODEL=stub-aux
            LLAMACPP_EMBED_MODEL=stub-embed MODEL_LOADER_TOKEN=stub-not-a-secret MODEL_LOADER_DATA_DIR=/stub/loader)
          for src in "" "$TREE"; do
            cfg=$(env "${stubs[@]}" COWORK_SOURCE_DIR="$src" docker compose --env-file .env.example --profile laya --profile code \
              -f compose.yaml -f compose.llamacpp.yaml -f compose.docling.yaml -f deploy/examples/code-sandbox.override.yml config --format json)
            n=0
            while IFS=$'\t' read -r svc ctx df; do
              [ -f "$ctx/$df" ] || { echo "::error::$svc builds $ctx/$df, which is not in the tree (COWORK_SOURCE_DIR='$src')"; exit 1; }
              case "$ctx" in "$TREE"|"$TREE"/*) ;; *) echo "::error::$svc context $ctx is outside the tree"; exit 1 ;; esac
              echo "ok: $svc -> ${ctx#"$TREE"}/$df"; n=$((n+1))
            done < <(jq -r '.services | to_entries[] | select(.value.build) | select(.key != "egress-rs") | [.key, .value.build.context, (.value.build.dockerfile // "Dockerfile")] | @tsv' <<<"$cfg")
            [ "$n" -ge 7 ] || { echo "::error::expected web, diary, ocr, laya, docling, model-loader and code-sandbox builds, saw $n"; exit 1; }
          done
      # build-web-release.sh is what the server runs: build/web.Dockerfile on the tree, stamped and
      # checked. The image build runs the client and server tests (node --test) first.
      - name: Build web image with build-web-release.sh
        if: env.RUN_JOB == 'true'
        env:
          TREE: ${{ steps.assemble.outputs.tree }}
          SHA: ${{ steps.assemble.outputs.sha }}
        run: bash deploy/tools/build-web-release.sh "$SHA" "$TREE"
      - name: version.json records the pinned web and core
        if: env.RUN_JOB == 'true'
        env:
          SHA: ${{ steps.assemble.outputs.sha }}
          WEB_REF: ${{ steps.assemble.outputs.web_ref }}
          CORE_REF: ${{ steps.assemble.outputs.core_ref }}
        run: |
          set -euo pipefail
          v=$(docker run --rm --entrypoint cat "cowork-web:$SHA" /app/dist/version.json)
          echo "$v"
          [ "$(jq -r .version <<<"$v")" = "$SHA" ] && [ "$(jq -r .web <<<"$v")" = "$WEB_REF" ] && [ "$(jq -r .core <<<"$v")" = "$CORE_REF" ]
      # #337: prove the container boots. Synthetic env only (no real secrets, no sidecars); poll
      # /api/ready so a runtime-only crash (a file the runtime stage never copied) fails here.
      - name: Boot web image and check /api/ready
        if: env.RUN_JOB == 'true'
        env:
          SHA: ${{ steps.assemble.outputs.sha }}
        run: |
          set -e
          docker run -d --name noevia-web-ci \
            -p 8021:8021 \
            -e UI_PORT=8021 \
            -e UI_AUTH_TOKEN=ci-synthetic-token-$RANDOM \
            -e DIARY_AUTH_TOKEN=ci-synthetic-diary-token-$RANDOM \
            -e DIARY_TENANT_KEY=$(openssl rand -hex 32) \
            -e INFERENCE_BASE_URL=http://127.0.0.1:1 \
            -e DIARY_BASE_URL=http://127.0.0.1:1 \
            "cowork-web:$SHA"
          ok=""
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:8021/api/ready -o /tmp/ready.json; then
              echo "Response: $(cat /tmp/ready.json)"
              ok=1
              break
            fi
            sleep 2
          done
          if [ -z "$ok" ]; then
            echo "web image never became ready; container logs follow:"
            docker logs noevia-web-ci || true
            docker rm -f noevia-web-ci || true
            exit 1
          fi
          grep -q "$SHA" /tmp/ready.json || { echo "::error::/api/ready does not report $SHA"; exit 1; }
          docker logs noevia-web-ci || true
          docker rm -f noevia-web-ci

  # #952: tools/repo-split (the Rust extraction tool). It stays for a rollback-and-retry of the
  # cutover (docs/repo-split-cutover.md); its byte-identity check against the pinned repos retired
  # with the cut (the last run is linked from the cutover PR).
  repo-split:
    name: Repo split tool
    needs: changes
    runs-on: ubuntu-latest
    env:
      RUN_JOB: ${{ needs.changes.outputs.split }}
    defaults:
      run:
        working-directory: tools/repo-split
    steps:
      - name: Skip (no relevant changes)
        if: env.RUN_JOB != 'true'
        working-directory: .
        run: echo "No repo-split changes; skipping."
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        if: env.RUN_JOB == 'true'
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@70dec6087f2cb6bab9fbac4da23160afbe848e91 # 1.99.0
        if: env.RUN_JOB == 'true'
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        if: env.RUN_JOB == 'true'
        with:
          workspaces: tools/repo-split
      - name: Install git-filter-repo
        if: env.RUN_JOB == 'true'
        run: python3 -m pip install --user git-filter-repo==2.47.0
      - run: cargo fmt --check
        if: env.RUN_JOB == 'true'
      - run: cargo clippy --locked --all-targets -- -D warnings
        if: env.RUN_JOB == 'true'
      - run: cargo test --locked
        if: env.RUN_JOB == 'true'
        env:
          REPO_SPLIT_REQUIRE_FILTER_REPO: "1"

  # Single aggregate result. Passes when every job succeeded or was skipped;
  # fails on any failure or cancellation.
  ci-required:
    name: CI required
    if: always()
    needs: [changes, deploy-tests, assembled-release, repo-split]
    runs-on: ubuntu-latest
    steps:
      - name: Check job results
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "Results: $RESULTS"
          for r in $RESULTS; do
            case "$r" in
              success|skipped) ;;
              *) echo "A required job ended with: $r"; exit 1 ;;
            esac
          done

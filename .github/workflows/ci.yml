name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  node-tests:
    name: Node tests, typecheck, frontend build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            apps/web/package-lock.json
            apps/web/server/package-lock.json
      # The tests exercise the real server (auth.cjs needs better-sqlite3 and
      # friends from the nested server package), so install both trees.
      - run: npm ci --no-fund --no-audit
      - run: npm ci --no-fund --no-audit
        working-directory: apps/web/server
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  python-tests:
    name: Diary test suite
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/diary
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/diary/requirements.txt
      - run: pip install -r requirements.txt
      - run: python -m pytest -q

  docker-build:
    name: Docker images build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build web image
        uses: docker/build-push-action@v6
        with:
          context: apps/web
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Build diary image
        uses: docker/build-push-action@v6
        with:
          context: services/diary
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

name: Offline skills MCP contract

on:
  pull_request:
    paths:
      - 'experiments/system-one/skills-mcp/**'
      # The server modules under test come from the noevia-core SHA pinned here (#952).
      - 'release/versions.lock'
      - '.github/workflows/skills-mcp-contract.yml'
  push:
    branches: [main]
    paths:
      - 'experiments/system-one/skills-mcp/**'
      - 'release/versions.lock'
      - '.github/workflows/skills-mcp-contract.yml'

permissions:
  contents: read

jobs:
  offline-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # The contract requires ../../../apps/web/server/*.cjs: lay the pinned noevia-core out at
      # apps/web (checksum-verified, never committed; the repo itself refuses apps/web).
      - name: Lay out the pinned noevia-core at apps/web
        run: |
          set -euo pipefail
          ref=$(sed -n 's/^NOEVIA_CORE_REF=//p' release/versions.lock); sum=$(sed -n 's/^NOEVIA_CORE_SHA256=//p' release/versions.lock)
          curl -fsSL --proto '=https' -o "$RUNNER_TEMP/core.tgz" "https://codeload.github.com/sbstndalton/noevia-core/tar.gz/$ref"
          echo "$sum  $RUNNER_TEMP/core.tgz" | sha256sum -c -
          mkdir -p apps/web && tar -xzf "$RUNNER_TEMP/core.tgz" --strip-components=1 -C apps/web
      # Pure collaborators and injected fixtures only; no package installation.
      - run: node --require ./apps/web/tests/hermetic-network.cjs --test experiments/system-one/skills-mcp/*.test.cjs
      - run: node experiments/system-one/skills-mcp/run.cjs --run-offline > "$RUNNER_TEMP/skills-mcp-results.jsonl"

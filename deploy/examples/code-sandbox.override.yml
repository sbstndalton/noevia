# Code mode's sandbox (spec-agent-execution §3, D14/D15). Not deployed; the user's call.
#
# Enabling Code mode without this runs the coding agent as a child of the web process — inside
# the container that holds noevia's state, sessions and credentials. This override moves it into
# a container of its own with nothing worth stealing and no way out except the egress proxy.
#
#   docker compose -f docker-compose.yml -f code-sandbox.override.yml --profile code up -d
#
# The web container then needs, in its own environment:
#   NOEVIA_FEATURE_CODE_HARNESS=true
#   CODE_HARNESS_ENDPOINT=code-sandbox:8030       # NOT CODE_HARNESS_COMMAND: that spawns locally
#   CODE_REPOS=scratch|/workspaces/repos/scratch  # repositories, named, absolute, git
#   CODE_WORKSPACE_ROOT=/workspaces/trees         # worktrees on the SHARED volume, not tenant state
#   CODE_HARNESS_USER=1000:1000                   # who the sandbox runs as
#   CODE_HARNESS_NAME=opencode|pi|claude-code|qwen-code|deepseek  # web: the harness noevia pins config for
#
# Those last two are not optional, and staging this on DaServer is what proved it:
#   * noevia creates the worktree and sends its absolute path; the supervisor resolves that same
#     path. They must therefore be the same path — one volume, one mount point, both containers.
#     Without CODE_WORKSPACE_ROOT the worktrees sit in the tenant's own state directory, which
#     the sandbox cannot see (and must not).
#   * noevia runs as root and the sandbox deliberately does not, so a freshly created worktree is
#     root-owned and the harness cannot write it. CODE_HARNESS_USER hands each one over.
services:
  code-sandbox:
    profiles: ["code"]
    build:
      context: ${COWORK_SOURCE_DIR:-..}/core/code-sandbox
      args:
        HARNESS_PACKAGE: ${CODE_SANDBOX_PACKAGE:-opencode-ai}
        HARNESS_VERSION: "${CODE_SANDBOX_HARNESS_VERSION:-1.18.31}"
    # Tagged by what it contains -- the harness and its pinned version -- not by the web
    # release, so an application overlay does not go looking for a sandbox tag nobody built.
    image: cowork-code-sandbox:${CODE_SANDBOX_VERSION:-local}
    restart: unless-stopped
    # Everything here is the boundary the ACP spike proved holds: read-only root, no
    # capabilities, no privilege escalation, an unprivileged user, and bounded memory and pids
    # so a runaway build cannot take the box down with it.
    read_only: true
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    user: "1000:1000"
    pids_limit: 512
    mem_limit: 3g
    tmpfs:
      # uid/gid, not just a mode: a bare tmpfs belongs to root, and the harness could not write
      # even its own .gitconfig without this.
      - /tmp:size=1g,mode=1777,uid=1000,gid=1000
      - /home/node:size=512m,mode=0700,uid=1000,gid=1000
    volumes:
      # The only writable, persistent thing it can see: the task worktrees. Same path both
      # sides. Repositories live under it so a task can be given one without widening this.
      - code-workspaces:/workspaces
    networks:
      # No default network: the only other member of `code` is web, which joins it so the
      # sandbox can reach the egress proxy. Diary, model-loader and the engine are not on it.
      # Web itself IS reachable here, on every port it binds, so web refuses (403) any UI or
      # file-sharing request that arrives on its code-network address (COWORK_CODE_NET_ADDR
      # below, #853). The egress proxy is a separate listener and is not affected.
      - code
    environment:
      WORKSPACE_ROOT: /workspaces
      # Which harness the sandbox runs; unset = OpenCode. For pi (noevia's ACP bridge routes its
      # approvals to noevia): CODE_SANDBOX_PACKAGE=@earendil-works/pi-coding-agent,
      # CODE_SANDBOX_HARNESS_VERSION=0.87.0, CODE_SANDBOX_COMMAND=node,
      # CODE_SANDBOX_ARGS=/srv/pi-acp-bridge.cjs, and on web CODE_HARNESS_NAME=pi.
      CODE_HARNESS_COMMAND: ${CODE_SANDBOX_COMMAND:-opencode}
      CODE_HARNESS_ARGS: ${CODE_SANDBOX_ARGS:-acp}
      # #999: js (default) or rust. rust runs the pi bridge's framing and toolCallFor and the
      # supervisor's start line and workspace check through the image's pinned sandbox-bridge.wasm;
      # a rust sandbox without a usable module does not start. The owner's flag to flip.
      SANDBOX_BRIDGE_IMPL: ${SANDBOX_BRIDGE_IMPL:-js}
      PORT: "8030"
    # No `ports:`. Publishing this would let anything that reaches the host start a coding
    # agent, and there is no authentication here by design — reachability IS the control.
    expose:
      - "8030"

  # Server-measured verification (#703): runs the OPERATOR's test command for a task's commit and
  # reports the exit status. Same image as the sandbox, deliberately NOT the same container: the
  # agent runs as uid 1000 with a writable /tmp and HOME, and anything it leaves behind must not
  # reach the run that decides whether its work passes. No network at all (web talks to it over a
  # unix socket on its own volume), the workspaces READ-ONLY, the command list only here.
  #
  # Three identities inside (noevia-core code-sandbox/verifier.cjs): the server starts as root with
  # every capability dropped except SETUID/SETGID, owns the socket (root, 0770) and only ever drops
  # to git (1002, with the repositories' shared group) for the copy and to the test uid (1003) for
  # the command. The test uid cannot signal the server, touch the socket or chmod the copy.
  # ONE-SHOT: it serves one request and exits; `restart: always` brings it back with fresh tmpfs,
  # so nothing a test started survives. Web retries for a few seconds while it restarts.
  #
  # Web needs CODE_VERIFY_ENDPOINT=unix:/run/noevia-verify/verify.sock. The source repositories
  # must be readable by CODE_REPOS_GID (a dedicated group): chgrp -R it, g+rX.
  code-verify:
    profiles: ["code"]
    image: cowork-code-sandbox:${CODE_SANDBOX_VERSION:-local}
    command: ["node", "verifier.cjs"]
    restart: always
    read_only: true
    user: "0:0"
    cap_drop: ["ALL"]
    cap_add: ["SETUID", "SETGID"]
    security_opt: ["no-new-privileges:true"]
    group_add: ["${CODE_REPOS_GID:-1005}"]
    network_mode: none
    pids_limit: 256
    mem_limit: 2g
    cpus: 2.0
    tmpfs:
      # The server's own files (root's). Fresh on every restart, like the two below.
      - /tmp:size=64m,mode=0755
      # The copy: written by the git uid, read-only to the test uid.
      - /verify/copy:size=2g,mode=0755,uid=1002,gid=1002
      # The test uid's HOME and TMPDIR.
      - /verify/run:size=1g,mode=0700,uid=1003,gid=1003
    volumes:
      - code-workspaces:/workspaces:ro
      - code-verify-socket:/run/noevia-verify
    environment:
      VERIFY_SOURCE_ROOT: /workspaces
      VERIFY_SOCKET: /run/noevia-verify/verify.sock
      VERIFY_GIT_USER: "1002:${CODE_REPOS_GID:-1005}"
      VERIFY_TEST_USER: "1003:1003"
      # `name|command`, one per line, names as in web's CODE_REPOS. Unset = verification off.
      CODE_VERIFY: ${CODE_VERIFY:-}
      CODE_VERIFY_WALL_MS: ${CODE_VERIFY_WALL_MS:-600000}

  web:
    networks:
      default: {}
      # The egress proxy (D15) runs inside web on CODE_EGRESS_PORT; the sandbox reaches it as
      # `egress`, the only way out of the internal code network, and only for granted domains.
      code:
        aliases: [egress]
    environment:
      CODE_EGRESS_PORT: ${CODE_EGRESS_PORT:-}
      CODE_EGRESS_HOST: egress
      CODE_VERIFY_ENDPOINT: ${CODE_VERIFY_ENDPOINT:-}
      # Web's own address on the code network (#853): IPs and/or host names, comma separated.
      # `egress` resolves to it (the alias above). UI and file-sharing requests arriving on it
      # get 403; the egress proxy is unaffected. Unset in web's own environment = no check.
      COWORK_CODE_NET_ADDR: ${COWORK_CODE_NET_ADDR:-egress}
    volumes:
      # The same volume at the same mount point — see the note above about paths matching.
      - code-workspaces:/workspaces
      # The verifier's socket. Mounted by web and code-verify only — never by the agent sandbox.
      - code-verify-socket:/run/noevia-verify

networks:
  code:
    internal: true

volumes:
  code-workspaces:
  code-verify-socket:

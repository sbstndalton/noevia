# Generic fresh-install storage overrides do not apply here; preserve explicit COWORK_STATE_DIR binds.
# Cowork stack for Unraid Compose Manager.
#
# Keep secrets in a separate .env file and configure Compose Manager's
# "Environment Path" to point to it. COWORK_SOURCE_DIR must identify the
# current source release; COWORK_STATE_DIR must identify durable state.
# Since the repo split (#952) a source release is an unpacked assembled tree
# (deploy/tools/assemble-release.sh: noevia/, web/, core/, services/, release-refs),
# so sidecars build from services/<name>, code-sandbox from core/code-sandbox and web
# from the tree root with noevia/build/web.Dockerfile.
name: cowork

services:
  laya:
    profiles: [laya]
    build:
      context: ${COWORK_SOURCE_DIR:?Set COWORK_SOURCE_DIR}/services/laya
    image: cowork-laya:${LAYA_VERSION:-0.3.5-noevia1}
    restart: "on-failure:3"
    read_only: true
    user: "1000:1000"
    mem_limit: 6g
    cpus: 2.0
    pids_limit: 128
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs: ["/tmp:size=128m,mode=1777"]
    environment:
      LAYA_DECISION_TIMEOUT_S: ${LAYA_DECISION_TIMEOUT_S:-1.3}
    volumes:
      - ${COWORK_LAYA_MODEL_DIR:-./state/laya}:/model:ro
    networks: [laya]

  diary:
    build:
      context: ${COWORK_SOURCE_DIR:?Set COWORK_SOURCE_DIR}/services/diary
    image: cowork-diary:${DIARY_VERSION:?Set DIARY_VERSION to the built Diary image tag}
    restart: unless-stopped
    expose:
      - "8010"
    environment:
      TZ: ${TZ:-America/New_York}
      CORPUS_BACKEND: ${CORPUS_BACKEND:-local}
      CORPUS_ROOT: ${CORPUS_ROOT:-}
      CORPUS_LOCAL_ROOT: /app/data/corpus
      WEBDAV_BASE_URL: ${WEBDAV_BASE_URL:-}
      WEBDAV_USERNAME: ${WEBDAV_USERNAME:-}
      WEBDAV_PASSWORD: ${WEBDAV_PASSWORD:-}
      DIARY_MONTH_FILE_TEMPLATE: ${DIARY_MONTH_FILE_TEMPLATE:-}
      DIARY_ENTRY_LAYOUT: ${DIARY_ENTRY_LAYOUT:-daily}
      DIARY_ENTRIES_PREFIX: ${DIARY_ENTRIES_PREFIX:-Entries}
      DIARY_INDEX_ENABLED: ${DIARY_INDEX_ENABLED:-false}
      DIARY_AUTH_TOKEN: ${DIARY_AUTH_TOKEN:-}
      # M2 tenant assertion key, shared with web only; deploy diary before web.
      DIARY_TENANT_KEY: ${DIARY_TENANT_KEY:-}
      # 1 = run with neither token nor key (LAN-only). Unset + both empty: refuses to start.
      DIARY_ALLOW_OPEN: ${DIARY_ALLOW_OPEN:-}
      DIARY_LEGACY_USER_ID: ${DIARY_LEGACY_USER_ID:-}
      # Tenant signatures use the mandatory native leaf (#1071, services#99).
      # Workspace ZIP gate (restore, import): empty = the Diary default (python); rust adds the noevia-rs
      # leaf, run first, listings must match, fails closed (#982). Needs a Diary image with the binary.
      WORKSPACE_RESTORE_VERIFY_IMPL: ${WORKSPACE_RESTORE_VERIFY_IMPL:-}
      # Operator-only mapping; add matching bind mounts in an override.
      DIARY_LOCAL_VOLUMES: ${DIARY_LOCAL_VOLUMES:-}
      DB_PATH: /app/data/index.db
      LLM_BASE_URL: ${INFERENCE_BASE_URL:-http://host.docker.internal:11434/v1}
      LLM_API_KEY: ${INFERENCE_API_KEY:-}
      LLM_CHAT_MODEL: ${DIARY_CHAT_MODEL:-default}
      LLM_EMBED_MODEL: ${EMBEDDING_MODEL:-default}
      # #1636: prompt framing of the embedding model (nomic-v1 = text unchanged, the default) and an
      # optional re-index target. Changing the model is a re-index (web /api/embedding), not an edit.
      LLM_EMBED_PROFILE: ${EMBEDDING_PROFILE:-nomic-v1}
      LLM_EMBED_NEXT_MODEL: ${EMBEDDING_NEXT_MODEL:-}
      LLM_EMBED_NEXT_BASE_URL: ${EMBEDDING_NEXT_BASE_URL:-}
      LLM_EMBED_NEXT_PROFILE: ${EMBEDDING_NEXT_PROFILE:-}
      EMBEDDING_REINDEX_DUTY: ${EMBEDDING_REINDEX_DUTY:-0.5}
      LLM_AUX_BASE_URL: ${AUX_INFERENCE_BASE_URL:-${INFERENCE_BASE_URL:-http://host.docker.internal:11434/v1}}
      LLM_AUX_API_KEY: ${AUX_INFERENCE_API_KEY-${INFERENCE_API_KEY:-}}
      LLM_AUX_MODEL: ${DIARY_AUX_MODEL:-${DIARY_CHAT_MODEL:-default}}
      # #2099 / #2105: optional explicit substitutes, used only when the id above is not served by the router.
      # Empty = none (the diary then refuses to answer until the id is served). The release preflight reads them.
      LLM_CHAT_FALLBACK_MODEL: ${LLM_CHAT_FALLBACK_MODEL:-}
      LLM_AUX_FALLBACK_MODEL: ${LLM_AUX_FALLBACK_MODEL:-}
    volumes:
      - ${COWORK_STATE_DIR:?Set COWORK_STATE_DIR}/diary:/app/data
    extra_hosts:
      - host.docker.internal:host-gateway
    healthcheck:
      test: ["CMD", "python", "-c", "import os,urllib.request; h={'Authorization':'Bearer '+os.environ.get('DIARY_AUTH_TOKEN','')} if os.environ.get('DIARY_AUTH_TOKEN') else {}; urllib.request.urlopen(urllib.request.Request('http://127.0.0.1:8010/api/health',headers=h),timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
    labels:
      net.unraid.docker.managed: composeman
      net.unraid.docker.shell: sh

  web:
    # tini as PID 1 reaps zombies and forwards SIGTERM to web-supervisor.sh (#1777).
    init: true
    networks: [default, ocr, laya]
    build:
      context: ${COWORK_SOURCE_DIR:?Set COWORK_SOURCE_DIR}
      dockerfile: noevia/build/web.Dockerfile
    image: cowork-web:${COWORK_VERSION:-local}
    restart: unless-stopped
    ports:
      - "${COWORK_PORT:-127.0.0.1:8021}:8021"
    environment:
      COWORK_DECISION_URL: ${COWORK_DECISION_URL:-}
      COWORK_DECISION_MODEL: ${COWORK_DECISION_MODEL:-}
      COWORK_DECISION_API_KEY: ${COWORK_DECISION_API_KEY:-}
      COWORK_SENSITIVITY_DECISION_URL: ${COWORK_SENSITIVITY_DECISION_URL:-}
      COWORK_SENSITIVITY_DECISION_MODEL: ${COWORK_SENSITIVITY_DECISION_MODEL:-}
      COWORK_SENSITIVITY_DECISION_API_KEY: ${COWORK_SENSITIVITY_DECISION_API_KEY:-}
      NOEVIA_FEATURE_STEP_SUPERVISION: ${NOEVIA_FEATURE_STEP_SUPERVISION:-}
      OCR_BASE_URL: http://ocr:8030
      UI_PORT: 8021
      # Separate optional listener; no port is published by default.
      COWORK_DAV_PORT: ${COWORK_DAV_PORT:-0}
      COWORK_DAV_SCOPE: ${COWORK_DAV_SCOPE:-}
      COWORK_DAV_ORIGIN: ${COWORK_DAV_ORIGIN:-}
      COWORK_DAV_PROXY_TOKEN: ${COWORK_DAV_PROXY_TOKEN:-}
      MEMBER_OUTBOUND_ORIGINS: ${MEMBER_OUTBOUND_ORIGINS:-}
      UI_AUTH_TOKEN: ${UI_AUTH_TOKEN:-}
      LEGACY_AUTH_COMPAT: ${LEGACY_AUTH_COMPAT:-false}
      PUBLIC_ORIGIN: ${PUBLIC_ORIGIN:-}
      WEBAUTHN_RP_ID: ${WEBAUTHN_RP_ID:-}
      # Set this if you also reach Cowork over a bare LAN IP (e.g. Unraid's
      # own address) alongside PUBLIC_ORIGIN (a Cloudflare Tunnel hostname,
      # say) — otherwise password login from the LAN IP 403s. Passkeys still
      # only work from PUBLIC_ORIGIN's hostname; see README.
      ADDITIONAL_TRUSTED_ORIGINS: ${ADDITIONAL_TRUSTED_ORIGINS:-}
      # Compose Manager sits behind Unraid's own proxy on most installs, and on a
      # Cloudflare Tunnel on this one. Without it every request looks like it came
      # from the proxy and per-IP rate limiting throttles everyone as one client.
      TRUST_PROXY: ${TRUST_PROXY:-false}
      # sbstndalton/noevia#1071: the only front. noevia-server answers sign-in and the account and the
      # read routes Node no longer has (usage, settings, routing, stats, ChatGPT status, storage reads,
      # export), and the project routes and store, so the web supervisor refuses to start without
      # NOEVIA_FRONT=rust. The old sign-in switch, the projects switch and the per-route switches are
      # retired and not passed through (a leftover value only warns).
      NOEVIA_FRONT: ${NOEVIA_FRONT:-rust}
      # #1726: multimodal RAG (images embedded beside text, chosen per answer). Off by default; the
      # model-loader reads the same switch (compose.embed.yaml) for the image-embedding preset.
      NOEVIA_MULTIMODAL_RAG: ${NOEVIA_MULTIMODAL_RAG:-0}
      CORPUS_BACKEND: ${CORPUS_BACKEND:-local}
      CORPUS_ROOT: ${CORPUS_ROOT:-}
      WEBDAV_BASE_URL: ${WEBDAV_BASE_URL:-}
      WEBDAV_USERNAME: ${WEBDAV_USERNAME:-}
      WEBDAV_PASSWORD: ${WEBDAV_PASSWORD:-}
      DIARY_BASE_URL: http://diary:8010
      DIARY_AUTH_TOKEN: ${DIARY_AUTH_TOKEN:-}
      DIARY_TENANT_KEY: ${DIARY_TENANT_KEY:-}
      LLM_RATE_LIMIT: ${LLM_RATE_LIMIT:-60}
      INFERENCE_BASE_URL: ${INFERENCE_BASE_URL:-http://host.docker.internal:11434}
      INFERENCE_API_KEY: ${INFERENCE_API_KEY:-}
      DEFAULT_PROVIDER_ID: ${DEFAULT_PROVIDER_ID:-default}
      DEFAULT_PROVIDER_LABEL: ${DEFAULT_PROVIDER_LABEL:-Local inference}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-default}
      EMBEDDING_BASE_URL: ${EMBEDDING_BASE_URL:-}
      # #1668: the settings-driven embedding service (compose.embed.yaml `embed`, run by the model
      # manager). Empty: web does not manage it and keeps the pre-#1668 behaviour.
      EMBEDDING_SERVICE_URL: ${EMBEDDING_SERVICE_URL:-}
      # #1636: see the Diary's LLM_EMBED_PROFILE above; the same values seed web's project retrieval.
      EMBEDDING_PROFILE: ${EMBEDDING_PROFILE:-nomic-v1}
      EMBEDDING_NEXT_MODEL: ${EMBEDDING_NEXT_MODEL:-}
      EMBEDDING_NEXT_BASE_URL: ${EMBEDDING_NEXT_BASE_URL:-}
      EMBEDDING_NEXT_PROFILE: ${EMBEDDING_NEXT_PROFILE:-}
      EMBEDDING_REINDEX_DUTY: ${EMBEDDING_REINDEX_DUTY:-0.5}
      # #1665: the optional RAG reranker (compose.rerank.yaml runs the TEI sidecar). Empty = off;
      # RERANK_BACKEND=tei with no RERANK_BASE_URL means http://rerank:8080.
      NOEVIA_FEATURE_RAG_RERANK: ${NOEVIA_FEATURE_RAG_RERANK:-}
      RERANK_BACKEND: ${RERANK_BACKEND:-}
      RERANK_BASE_URL: ${RERANK_BASE_URL:-}
      RERANK_MODEL: ${RERANK_MODEL:-}
      RERANK_API_KEY: ${RERANK_API_KEY:-}
      RERANK_TEI_BASE_URL: ${RERANK_TEI_BASE_URL:-}
      RERANK_TEI_MODEL: ${RERANK_TEI_MODEL:-}
      RERANK_LLAMACPP_BASE_URL: ${RERANK_LLAMACPP_BASE_URL:-}
      RAG_RERANK_POOL: ${RAG_RERANK_POOL:-}
      RAG_RERANK_KEEP: ${RAG_RERANK_KEEP:-}
      RAG_RERANK_DEADLINE_MS: ${RAG_RERANK_DEADLINE_MS:-}
      MODEL_MANAGER_KIND: ${MODEL_MANAGER_KIND:-none}
      MODEL_MANAGER_BASE_URL: ${MODEL_MANAGER_BASE_URL:-http://host.docker.internal:11434}
      MODEL_MANAGER_API_KEY: ${MODEL_MANAGER_API_KEY:-}
      # noevia#2115: the inference gate's admin token (the same secret as the gate's). Blank: an
      # administrator cannot unload a model that is answering a request.
      INFERENCE_GATE_ADMIN_TOKEN: ${INFERENCE_GATE_ADMIN_TOKEN:-}
      LLAMACPP_PRESET_PATH: ${LLAMACPP_PRESET_PATH:-}
      # Optional MCP server. Empty = no MCP toolboxes, which is a healthy state,
      # not a degraded one. These six keys are easy to leave out when this file
      # is copied into Compose Manager by hand, and the symptom is not an error:
      # the toolboxes simply do not appear. deployment-config.test.cjs and the
      # preflight drift check exist to catch exactly that.
      # One Nextcloud MCP server, the historical form.
      MCP_SERVER_URL: ${MCP_SERVER_URL:-}
      # Several servers: `id|url|auth` entries, comma separated. auth is
      # `nextcloud` (forward the user's Nextcloud app password), `bearer:NAME`
      # (a service token read from that environment variable) or `none`.
      # Omitting auth means none — a server never inherits the credential by
      # accident. Takes precedence over MCP_SERVER_URL when set.
      MCP_SERVERS: ${MCP_SERVERS:-}
      # Which curated toolboxes are offered in the picker. Unset offers all of
      # them; `core` is always offered.
      ENABLED_TOOLBOXES: ${ENABLED_TOOLBOXES:-}
      # Service tokens for MCP servers configured with `bearer:NAME`. The name
      # is referenced from MCP_SERVERS; the value lives here and never in a URL.
      TAVILY_API_KEY: ${TAVILY_API_KEY:-}
      # Origins that are the SAME Nextcloud the MCP server talks to. Only a
      # credential stored for one of these is ever forwarded. Empty = never.
      MCP_NEXTCLOUD_ORIGINS: ${MCP_NEXTCLOUD_ORIGINS:-}
      # noevia's own capabilities over MCP (Diary reads, project documents).
      # In-process second listener on loopback; 0 disables it entirely and is
      # the default. NEVER add this to `ports:` — it answers to a capability
      # token, not a session cookie. Pair it with an MCP_SERVERS entry:
      #   noevia|http://127.0.0.1:8022/mcp|internal
      MCP_INTERNAL_PORT: ${MCP_INTERNAL_PORT:-0}
      UI_DATA_DIR: /app/server/ui-data
      PROJECT_SOURCE_LIMIT: ${PROJECT_SOURCE_LIMIT:-}
      PROJECT_DOCUMENT_LIMIT: ${PROJECT_DOCUMENT_LIMIT:-}
      PROJECT_IMAGE_LIMIT: ${PROJECT_IMAGE_LIMIT:-}
      FOLDER_IMPORT_MAX_FILES: ${FOLDER_IMPORT_MAX_FILES:-}
      FOLDER_IMPORT_MAX_BYTES: ${FOLDER_IMPORT_MAX_BYTES:-}
      # Large-document reads and sync OCR (core#149, core#150); empty keeps core defaults.
      PROJECT_DOCUMENT_READ_BYTES: ${PROJECT_DOCUMENT_READ_BYTES:-}
      PROJECT_DOCUMENT_PAGE_LIMIT: ${PROJECT_DOCUMENT_PAGE_LIMIT:-}
      PROJECT_DOCUMENT_TEXT_LIMIT: ${PROJECT_DOCUMENT_TEXT_LIMIT:-}
      PROJECT_DOCUMENT_RANGE_PAGES: ${PROJECT_DOCUMENT_RANGE_PAGES:-}
      PROJECT_SYNC_OCR_PAGES: ${PROJECT_SYNC_OCR_PAGES:-}
      LARGE_DOCUMENT_ACQUIRE_WAIT_MS: ${LARGE_DOCUMENT_ACQUIRE_WAIT_MS:-}
      LARGE_DOCUMENT_HOLD_WARN_MS: ${LARGE_DOCUMENT_HOLD_WARN_MS:-}
      PROJECT_TAIL_EMBED_PER_PASS: ${PROJECT_TAIL_EMBED_PER_PASS:-}
      PROJECT_TAIL_EMBED_PER_HOUR: ${PROJECT_TAIL_EMBED_PER_HOUR:-}
      PROJECT_TAIL_EMBED_PER_DOCUMENT: ${PROJECT_TAIL_EMBED_PER_DOCUMENT:-}
      PROJECT_TAIL_EMBED_BATCH: ${PROJECT_TAIL_EMBED_BATCH:-}
      PROJECT_UPLOAD_COMPLETION_PER_PASS: ${PROJECT_UPLOAD_COMPLETION_PER_PASS:-}
      PROJECT_BACKFILL_DUTY: ${PROJECT_BACKFILL_DUTY:-}
      PROJECT_BACKFILL_MIN_PAUSE_MS: ${PROJECT_BACKFILL_MIN_PAUSE_MS:-}
      PROJECT_BACKFILL_DELAY_MS: ${PROJECT_BACKFILL_DELAY_MS:-}
      PROJECT_BACKFILL_INTERVAL_MS: ${PROJECT_BACKFILL_INTERVAL_MS:-}
    volumes:
      - ${COWORK_STATE_DIR:?Set COWORK_STATE_DIR}/web:/app/server/ui-data
    extra_hosts:
      - host.docker.internal:host-gateway
    depends_on:
      diary:
        condition: service_healthy
    labels:
      net.unraid.docker.managed: composeman
      # Web binds to 127.0.0.1 (tunnel-only); the old http://[IP]:[PORT] link would be dead.
      net.unraid.docker.webui: https://noevia.daserver.work
      net.unraid.docker.shell: sh

  ocr:
    build:
      context: ${COWORK_SOURCE_DIR:?Set COWORK_SOURCE_DIR}/services/ocr
    image: cowork-ocr:${OCR_VERSION:?Set OCR_VERSION to the built OCR image tag}
    environment:
      # #1071: retired selector, pinned to the native server and never read from .env. An image
      # built before the retirement defaults to python, so the key stays rather than being dropped.
      NOEVIA_OCR_IMPL: rust
      # #1867: ranged-extract body cap; empty keeps the image default (96 MiB).
      OCR_EXTRACT_MAX_BYTES: ${OCR_EXTRACT_MAX_BYTES:-}
    restart: unless-stopped
    read_only: true
    mem_limit: 1g
    cpus: 1.0
    pids_limit: 64
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs:
      - /tmp:size=536870912,mode=1777
    networks: [ocr]

networks:
  laya:
    internal: true
  ocr:
    internal: true

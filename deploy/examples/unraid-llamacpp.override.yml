# Replace the Lemonade-network override only after native workload qualification.
# Keep the prior override and environment for rollback. Stop Lemonade and other
# GPU test containers first; disable their automatic restart while native is live.
services:
  llama:
    image: ghcr.io/ggml-org/llama.cpp:server-vulkan@sha256:94bd70ef60ef6d670c85999c144f59013e06525d9ee26b3563ab9b2f29d1ea41
    restart: unless-stopped
    command: ["--models-preset", "/config/models.ini", "--host", "0.0.0.0", "--port", "8080", "--models-max", "1", "--metrics"]
    devices:
      - ${LLAMACPP_RENDER_DEVICE:?Set the qualified device}:${LLAMACPP_RENDER_DEVICE}
      - ${LLAMACPP_CARD_DEVICE:?Set the qualified device}:${LLAMACPP_CARD_DEVICE}
    volumes:
      - ${LLAMACPP_MODELS_DIR:?Set existing public model directory}:/models:ro
      - ${LLAMACPP_CONFIG_DIR:?Set qualified preset directory}:/config:ro
      - ${LLAMACPP_CACHE_DIR:?Set dedicated writable native cache}:/cache
    environment:
      LLAMA_CACHE: /cache
    mem_limit: ${LLAMACPP_MEMORY_LIMIT:-14g}
    memswap_limit: ${LLAMACPP_MEMORY_LIMIT:-14g}
    labels:
      net.unraid.docker.managed: composeman
      net.unraid.docker.shell: sh
    # Internal Compose network only; no host ports and no Docker socket.
  # Model Loader (github.com/scratchhax/model-loader, MIT): model downloads, the full
  # models.ini editor, autoconfig, benchmarks and backend restarts. It has no login and
  # holds the Docker socket, so it publishes no port; noevia serves it to administrators
  # at /model-loader.
  model-loader:
    build:
      context: ${COWORK_SOURCE_DIR:-.}/deploy/model-loader
    image: cowork-model-loader:${COWORK_VERSION:-local}
    restart: unless-stopped
    environment:
      MODELS_DIR: /models
      MODELS_INI_PATH: /config/models.ini
      DATA_DIR: /data
      LLAMA_CONTAINERS: ${MODEL_LOADER_LLAMA_CONTAINERS:-}
      GPU_VRAM: ${MODEL_LOADER_GPU_VRAM:-}
      HOST_RAM_RESERVE_GB: ${MODEL_LOADER_HOST_RAM_RESERVE_GB:-8}
    volumes:
      - ${LLAMACPP_MODELS_DIR}:/models
      - ${LLAMACPP_CONFIG_DIR}:/config
      - ${MODEL_LOADER_DATA_DIR:?Set a writable Model Loader data directory}:/data
      - /var/run/docker.sock:/var/run/docker.sock
    mem_limit: 512m
  web:
    environment:
      LLAMACPP_PRESET_PATH: /llamacpp-config/models.ini
      # Preset suggestions read model file headers read-only and size against this limit.
      LLAMACPP_MODELS_PATH: /models
      LLAMACPP_MEMORY_LIMIT: ${LLAMACPP_MEMORY_LIMIT:-14g}
      LLAMACPP_CACHE_PATH: /cache
      # Calibration stops a step when host available memory falls below this.
      LLAMACPP_CALIBRATION_MEMORY_FLOOR_GIB: ${LLAMACPP_CALIBRATION_MEMORY_FLOOR_GIB:-4}
      MODEL_LOADER_URL: http://model-loader:8090
    volumes:
      - ${LLAMACPP_CONFIG_DIR}:/llamacpp-config
      - ${LLAMACPP_MODELS_DIR}:/models:ro
      - ${LLAMACPP_CACHE_DIR}:/cache:ro

# Rust egress proxy for Code mode (#926). DARK: not part of any deployment until the owner adds
# this file AND sets CODE_EGRESS_IMPL=rust. Layer it after code-sandbox.override.yml:
#
#   docker compose -f docker-compose.yml -f code-sandbox.override.yml \
#     -f code-egress-rust.override.yml --profile code up -d
#
# With CODE_EGRESS_IMPL unset or `node` (the default) web keeps its in-process proxy
# (code-egress.cjs) and this service merely idles with no grants it can verify (no key file is
# written in node mode, so every request is refused). Rolling back = CODE_EGRESS_IMPL=node.
#
# What changes with CODE_EGRESS_IMPL=rust:
#   * web derives the grant key (secretStore.derive('code-egress-grant')) and writes it, hex, to
#     CODE_EGRESS_GRANT_KEY_FILE on the `code-egress-key` volume — mounted by web (rw) and this
#     proxy (ro) only, never by the sandbox.
#   * tasks are pointed at egress-rs:CODE_EGRESS_PORT with a signed per-task grant
#     (docs/egress-grant-contract.md); web posts a signed revoke there when a task ends.
#   * the proxy listens only on its address on the internal `code` network (CODE_EGRESS_BIND is
#     its alias, resolved at start) and reaches the internet through `default`. No ports are
#     published.
services:
  egress-rs:
    profiles: ["code"]
    # Built from the Dockerfile's pinned NOEVIA_RS_REF + NOEVIA_RS_SHA256 (= release/versions.lock).
    # Deliberately no build args: overriding the ref without its checksum would only fail the build.
    build:
      # Relative to the first compose file, as code-sandbox.override.yml's ../../services/code-sandbox.
      context: ../../deploy/egress-proxy
    # Tagged separately from the web release (per-service versioning).
    image: cowork-egress-rs:${EGRESS_RS_VERSION:-local}
    restart: unless-stopped
    read_only: true
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    pids_limit: 128
    mem_limit: 256m
    networks:
      default: {}
      code:
        aliases: [egress-rs]
    environment:
      CODE_EGRESS_BIND: egress-rs
      CODE_EGRESS_PORT: ${CODE_EGRESS_PORT:-8040}
      CODE_EGRESS_GRANT_KEY_FILE: /run/noevia-egress/grant.key
      CODE_EGRESS_MAX_CONNECTIONS: ${CODE_EGRESS_MAX_CONNECTIONS:-256}
      CODE_EGRESS_MAX_CONNECTIONS_PER_TASK: ${CODE_EGRESS_MAX_CONNECTIONS_PER_TASK:-64}
      CODE_EGRESS_TUNNEL_IDLE_MS: ${CODE_EGRESS_TUNNEL_IDLE_MS:-600000}
    volumes:
      - code-egress-key:/run/noevia-egress:ro

  web:
    environment:
      CODE_EGRESS_IMPL: ${CODE_EGRESS_IMPL:-node}
      CODE_EGRESS_RUST_HOST: egress-rs
      CODE_EGRESS_GRANT_KEY_FILE: /run/noevia-egress/grant.key
    volumes:
      - code-egress-key:/run/noevia-egress

volumes:
  code-egress-key:

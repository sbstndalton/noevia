# Native egress profile; layer after code-sandbox.override.yml only for a qualified release.
# Web owns control-key publication and authenticated Ready/5 s renewal; Rust owns forwarding,
# admission, revocation and reports. CODE_EGRESS_IMPL=node is unsupported, never a fallback.
# Merely building this image or observing --capabilities is NOT authenticated readiness.
#
# Before activation, explicitly prepare a NEW trusted local CODE_EGRESS_CONTROL_KEY_DIR:
# canonical absolute path, owner CODE_EGRESS_KEY_UID (web's actual UID, default 0), group
# CODE_EGRESS_KEY_GID (default 1006), mode 0750, no symlink path components. A preexisting
# current.key must be regular, single-link, same UID/GID and mode 0440. Web creates/replaces
# only that key. Neither container creates or repairs this directory or the old grant volume.
# The sandbox never receives this mount. Actual Linux mounted ownership/startup and full
# release qualification remain required; these example settings do not grant host access.
#
# Both listeners use the same explicit port. egress-rs-code exists on the internal code
# network ONLY: never bind the multi-network service name. No ports are published. Web's
# separate `egress` alias remains for its model relay and code-network UI refusal boundary.
# Removing this profile requires disabling egress (CODE_EGRESS_PORT unset/0), not selecting
# the retired Node listener. Preserve the prior qualified release for operational rollback.
services:
  egress-rs:
    profiles: ["code"]
    # The native target rejects legacy binaries. Release ref/checksum defaults remain locked;
    # activation requires a coherently qualified release containing the paired native source.
    build:
      # Relative to the first compose file (unchanged by the repo split: deploy/ stays in noevia).
      context: ../../deploy/egress-proxy
      target: native-control
    # Tagged separately from the web release (per-service versioning).
    image: cowork-egress-rs:${EGRESS_RS_VERSION:-local}
    command: ["--native-control-v1"]
    restart: unless-stopped
    read_only: true
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    pids_limit: 128
    mem_limit: 256m
    group_add: ["${CODE_EGRESS_KEY_GID:-1006}"]
    networks:
      default: {}
      code:
        aliases: [egress-rs-code]
    environment:
      CODE_EGRESS_BIND: egress-rs-code
      CODE_EGRESS_PORT: ${CODE_EGRESS_PORT:-8040}
      CODE_EGRESS_CONTROL_KEY_FILE: /run/noevia-egress-control/current.key
      CODE_EGRESS_CONTROL_KEY_UID: "${CODE_EGRESS_KEY_UID:-0}"
      CODE_EGRESS_CONTROL_KEY_GID: "${CODE_EGRESS_KEY_GID:-1006}"
      CODE_EGRESS_MAX_CONNECTIONS: ${CODE_EGRESS_MAX_CONNECTIONS:-256}
      CODE_EGRESS_MAX_CONNECTIONS_PER_TASK: ${CODE_EGRESS_MAX_CONNECTIONS_PER_TASK:-64}
      CODE_EGRESS_TUNNEL_IDLE_MS: ${CODE_EGRESS_TUNNEL_IDLE_MS:-600000}
    volumes:
      - type: bind
        source: ${CODE_EGRESS_CONTROL_KEY_DIR:?prepare a private native control key directory first}
        target: /run/noevia-egress-control
        read_only: true
        bind:
          create_host_path: false

  web:
    environment:
      CODE_EGRESS_IMPL: ${CODE_EGRESS_IMPL:-rust}
      CODE_EGRESS_PORT: ${CODE_EGRESS_PORT:-8040}
      CODE_EGRESS_RUST_HOST: egress-rs-code
      CODE_EGRESS_CONTROL_KEY_FILE: /run/noevia-egress-control/current.key
      CODE_EGRESS_KEY_UID: "${CODE_EGRESS_KEY_UID:-0}"
      CODE_EGRESS_KEY_GID: "${CODE_EGRESS_KEY_GID:-1006}"
      # Grant lifetime (absolute, ms): default 2 h, capped at 24 h by the contract.
      CODE_EGRESS_GRANT_LIFETIME_MS: ${CODE_EGRESS_GRANT_LIFETIME_MS:-7200000}
    volumes:
      - type: bind
        source: ${CODE_EGRESS_CONTROL_KEY_DIR:?prepare a private native control key directory first}
        target: /run/noevia-egress-control
        read_only: false
        bind:
          create_host_path: false

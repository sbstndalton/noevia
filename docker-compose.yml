# Cowork Workspace — DaServer deployment stack
# Deploy target: /mnt/docker/appdata/cowork/   (docker compose up -d)
#
# Shape (build-spec v0.5 as built, UI superseded 2026-09-03 by user decision):
#   ui               — the one thing you open (host port 8021): the mockup-faithful
#                      Cowork frontend + same-origin /api proxy (SSE chat via LiteLLM
#                      aliases, diary sidecar reads, per-space history).
#   anythingllm      — superseded frontend, kept running during burn-in only
#                      (host port 8020). Retire after the UI proves out (gated).
#   litellm          — internal gateway/router. Alias → endpoint mapping:
#                        diary | e4b | e2b | gpt-oss-20b
#                      (diary → diary-companion sidecar; the rest → Lemonade)
#   diary-companion  — internal sidecar, same untouched code/image as the standalone
#                      container. Own data dir (separate SQLite). No exposed port.
#
# Upstream images are PINNED by index digest (tag kept for readability) so upstream
# pushes/retags can never move a running stack. Upgrade procedure + release flow for
# diary-companion: see UPGRADES.md. Dependency updates arrive only as tracked commits.
#
# Ground rules honored:
#   - Nothing here re-exposes Lemonade; LiteLLM and the sidecar are internal-only.
#   - The standalone diary-companion container (port 8010) keeps running untouched
#     until the sidecar path is verified end-to-end AND the user signs off.
#   - Every deploy step is gated on explicit user sign-off (see MIGRATION.md).

services:
  anythingllm:
    # Pin: index digest captured 2026-09-03 via `docker buildx imagetools inspect`
    # (UPGRADES.md "Upgrading an upstream image"). Bump only via a tracked commit.
    image: ghcr.io/mintplex-labs/anything-llm:latest@sha256:eb812f3da085289d1dc3dd11437c0946e8139d92d5c68bcf6031b2151e99a93c
    container_name: cowork-anythingllm
    restart: unless-stopped
    ports:
      - "8020:3001"            # 8020 is unused per DaServer.md port table (final check before up)
    env_file:
      - anythingllm.env        # JWT_SECRET, DISABLE_TELEMETRY, provider preseed
    environment:
      # Required by the official image (collector crashes without it)
      - STORAGE_DIR=/app/server/storage
    volumes:
      - ./anythingllm-storage:/app/server/storage
    depends_on:
      - litellm
    networks:
      - internal

  litellm:
    # Pin: index digest captured 2026-09-03 (UPGRADES.md). Bump only via a tracked commit.
    image: ghcr.io/berriai/litellm:main-stable@sha256:a53a7d3ffebede1925bd3ee8a21e4a7b9b63e2e68ec883af136edcccb6eeb82c
    container_name: cowork-litellm
    restart: unless-stopped
    command: ["--config", "/app/config.yaml", "--port", "4000"]
    env_file:
      - litellm/.env           # LITELLM_MASTER_KEY, DIARY_AUTH_TOKEN (copied, not regenerated)
    volumes:
      - ./litellm/config.yaml:/app/config.yaml:ro
    # No ports: — LiteLLM is reachable only inside this stack (and via lemonade network
    # if ever needed; it never fronts Lemonade itself).
    networks:
      - internal
      - lemonade

  diary-companion:
    # Builds from the diary-companion repo checkout (tag v0.1.4, master step 7:
    # month-browsing reads — /api/months + /api/day?month=YYYY-MM).
    # If the tag is ever missing on a fresh host, rebuild from the repo checkout first:
    #   docker build -t diary-companion:0.1.4 /mnt/docker/appdata/diary-companion
    # Version contract: the pin must reference a tag that already exists on the host.
    # Release flow (bump → tag → rebuild → re-pin) lives in UPGRADES.md.
    image: diary-companion:0.1.4
    container_name: cowork-diary-companion
    restart: unless-stopped
    env_file:
      - diary-companion.env    # copied from the standalone .env — credentials migrate, never regenerate
    environment:
      # Cutover config (user decision 2026-09-03): the app adapts to the REAL corpus —
      # human-named month files, no INDEX.md (see diary-companion 0.1.1 knobs).
      - CORPUS_REMOTE_ROOT=Documents/Important Documents/Diary
      - DIARY_MONTH_FILE_TEMPLATE=Diary - {month_name} {year}.md
      - DIARY_INDEX_ENABLED=false
    volumes:
      - ./diary-data:/app/data          # separate SQLite (journal + vec index) — never shared with standalone
      - ./diary-config:/app/config:ro   # same config dir pattern as standalone
    # Image's built-in healthcheck probes /api/health without auth -> 401 once a token
    # is set. Override with an authed probe (token already in container env).
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import os,urllib.request; h={'Authorization':'Bearer '+os.environ.get('DIARY_AUTH_TOKEN','')} if os.environ.get('DIARY_AUTH_TOKEN') else {}; print(urllib.request.urlopen(urllib.request.Request('http://127.0.0.1:8010/api/health', headers=h), timeout=5).status)\""]
      interval: 60s
      timeout: 10s
      retries: 3
    # No ports: — internal only, per spec §4.
    networks:
      - internal
      - lemonade

  ui:
    # The one thing you open — the mockup-faithful Cowork frontend (ui-mockups/
    # Main + Diary + Settings artboards, light+dark). Serves the built SPA plus a
    # same-origin /api proxy: SSE chat via LiteLLM aliases, diary sidecar reads,
    # per-space history. Secrets enter only via ui.env (copied server-side).
    build: ./ui
    container_name: cowork-ui
    restart: unless-stopped
    ports:
      - "8021:8021"            # 8021 unused per DaServer.md port table (verify before up)
    environment:
      - UI_PORT=8021
      - LEMONADE_BASE_URL=http://lemonade:13305
      - DIARY_BASE_URL=http://cowork-diary-companion:8010
    env_file:
      - ui.env                 # DIARY_AUTH_TOKEN (LITELLM_MASTER_KEY now unused; file kept as-is)
    volumes:
      - ./ui-data:/app/server/ui-data   # persisted per-space histories (JSON)
    depends_on:
      - diary-companion
    networks:
      - internal
      - lemonade               # the UI talks to Lemonade directly (LiteLLM retired from the chat path)

networks:
  internal: {}
  lemonade:
    external: true
    name: lemonade_default

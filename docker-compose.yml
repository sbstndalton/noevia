# Cowork Workspace — DaServer deployment stack
# Deploy target: /mnt/docker/appdata/cowork/   (docker compose up -d)
#
# Shape (build-spec v0.5):
#   anythingllm      — the one thing you open (host port 8020). Single Generic OpenAI
#                      provider pointing at LiteLLM; each workspace picks a model alias.
#   litellm          — internal gateway/router. Alias → endpoint mapping:
#                        diary | e4b | e2b | gpt-oss-20b
#                      (diary → diary-companion sidecar; the rest → Lemonade)
#   diary-companion  — internal sidecar, same untouched code/image as the standalone
#                      container. Own data dir (separate SQLite). No exposed port.
#
# Ground rules honored:
#   - Nothing here re-exposes Lemonade; LiteLLM and the sidecar are internal-only.
#   - The standalone diary-companion container (port 8010) keeps running untouched
#     until the sidecar path is verified end-to-end AND the user signs off.
#   - Every deploy step is gated on explicit user sign-off (see MIGRATION.md).

services:
  anythingllm:
    image: ghcr.io/mintplex-labs/anything-llm:latest
    container_name: cowork-anythingllm
    restart: unless-stopped
    ports:
      - "8020:3001"            # 8020 is unused per DaServer.md port table (final check before up)
    env_file:
      - anythingllm.env        # JWT_SECRET, DISABLE_TELEMETRY, provider preseed
    environment:
      # Required by the official image (collector crashes without it)
      - STORAGE_DIR=/app/server/storage
    volumes:
      - ./anythingllm-storage:/app/server/storage
    depends_on:
      - litellm
    networks:
      - internal

  litellm:
    image: ghcr.io/berriai/litellm:main-stable
    container_name: cowork-litellm
    restart: unless-stopped
    command: ["--config", "/app/config.yaml", "--port", "4000"]
    env_file:
      - litellm/.env           # LITELLM_MASTER_KEY, DIARY_AUTH_TOKEN (copied, not regenerated)
    volumes:
      - ./litellm/config.yaml:/app/config.yaml:ro
    # No ports: — LiteLLM is reachable only inside this stack (and via lemonade network
    # if ever needed; it never fronts Lemonade itself).
    networks:
      - internal
      - lemonade

  diary-companion:
    # Same image the standalone container built (diary-companion:0.1.0) — code untouched.
    # If the tag is ever missing on a fresh host, rebuild from the repo first:
    #   docker build -t diary-companion:0.1.0 /mnt/docker/appdata/diary-companion
    image: diary-companion:0.1.1
    container_name: cowork-diary-companion
    restart: unless-stopped
    env_file:
      - diary-companion.env    # copied from the standalone .env — credentials migrate, never regenerate
    environment:
      # Cutover config (user decision 2026-09-03): the app adapts to the REAL corpus —
      # human-named month files, no INDEX.md (see diary-companion 0.1.1 knobs).
      - CORPUS_REMOTE_ROOT=Documents/Important Documents/Diary
      - DIARY_MONTH_FILE_TEMPLATE=Diary - {month_name} {year}.md
      - DIARY_INDEX_ENABLED=false
    volumes:
      - ./diary-data:/app/data          # separate SQLite (journal + vec index) — never shared with standalone
      - ./diary-config:/app/config:ro   # same config dir pattern as standalone
    # Image's built-in healthcheck probes /api/health without auth -> 401 once a token
    # is set. Override with an authed probe (token already in container env).
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import os,urllib.request; h={'Authorization':'Bearer '+os.environ.get('DIARY_AUTH_TOKEN','')} if os.environ.get('DIARY_AUTH_TOKEN') else {}; print(urllib.request.urlopen(urllib.request.Request('http://127.0.0.1:8010/api/health', headers=h), timeout=5).status)\""]
      interval: 60s
      timeout: 10s
      retries: 3
    # No ports: — internal only, per spec §4.
    networks:
      - internal
      - lemonade

networks:
  internal: {}
  lemonade:
    external: true
    name: lemonade_default

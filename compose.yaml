name: cowork

services:
  laya:
    profiles: [laya]
    build:
      context: ./services/laya
    image: cowork-laya:0.3.5-noevia1
    restart: "on-failure:3"
    read_only: true
    user: "1000:1000"
    mem_limit: 6g
    cpus: 2.0
    pids_limit: 128
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs: ["/tmp:size=128m,mode=1777"]
    volumes:
      - ${COWORK_LAYA_MODEL_DIR:-./state/laya}:/model:ro
    networks: [laya]

  diary:
    build: ./services/diary
    image: cowork-diary:${DIARY_VERSION:?Set DIARY_VERSION to the built Diary image tag}
    restart: unless-stopped
    expose:
      - "8010"
    environment:
      TZ: ${TZ:-America/New_York}
      CORPUS_BACKEND: ${CORPUS_BACKEND:-local}
      CORPUS_ROOT: ${CORPUS_ROOT:-}
      CORPUS_LOCAL_ROOT: /app/data/corpus
      WEBDAV_BASE_URL: ${WEBDAV_BASE_URL:-}
      WEBDAV_USERNAME: ${WEBDAV_USERNAME:-}
      WEBDAV_PASSWORD: ${WEBDAV_PASSWORD:-}
      S3_ENDPOINT_URL: ${S3_ENDPOINT_URL:-}
      S3_BUCKET: ${S3_BUCKET:-}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-}
      S3_SESSION_TOKEN: ${S3_SESSION_TOKEN:-}
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_PREFIX: ${S3_PREFIX:-}
      DIARY_MONTH_FILE_TEMPLATE: ${DIARY_MONTH_FILE_TEMPLATE:-}
      DIARY_ENTRY_LAYOUT: ${DIARY_ENTRY_LAYOUT:-daily}
      DIARY_ENTRIES_PREFIX: ${DIARY_ENTRIES_PREFIX:-Entries}
      DIARY_INDEX_ENABLED: ${DIARY_INDEX_ENABLED:-false}
      DIARY_EXTERNAL_SOURCES: ${DIARY_EXTERNAL_SOURCES:-}
      DIARY_AUTH_TOKEN: ${DIARY_AUTH_TOKEN:-}
      DIARY_LEGACY_USER_ID: ${DIARY_LEGACY_USER_ID:-}
      # Operator-only mapping; add matching bind mounts in an override.
      DIARY_LOCAL_VOLUMES: ${DIARY_LOCAL_VOLUMES:-}
      DB_PATH: /app/data/index.db
      LLM_BASE_URL: ${INFERENCE_BASE_URL:-http://host.docker.internal:11434/v1}
      LLM_API_KEY: ${INFERENCE_API_KEY:-}
      LLM_CHAT_MODEL: ${DIARY_CHAT_MODEL:-default}
      LLM_EMBED_MODEL: ${EMBEDDING_MODEL:-default}
      LLM_AUX_BASE_URL: ${AUX_INFERENCE_BASE_URL:-${INFERENCE_BASE_URL:-http://host.docker.internal:11434/v1}}
      LLM_AUX_API_KEY: ${AUX_INFERENCE_API_KEY-${INFERENCE_API_KEY:-}}
      LLM_AUX_MODEL: ${DIARY_AUX_MODEL:-${DIARY_CHAT_MODEL:-default}}
    volumes:
      - ${COWORK_DIARY_STORAGE:-${COWORK_STATE_DIR:-./state}/diary}:/app/data
    extra_hosts:
      - host.docker.internal:host-gateway
    healthcheck:
      test: ["CMD", "python", "-c", "import os,urllib.request; h={'Authorization':'Bearer '+os.environ.get('DIARY_AUTH_TOKEN','')} if os.environ.get('DIARY_AUTH_TOKEN') else {}; urllib.request.urlopen(urllib.request.Request('http://127.0.0.1:8010/api/health',headers=h),timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3

  web:
    networks: [default, ocr, laya]
    build:
      context: ./apps/web
      # Threaded through to STAMP_VERSION (apps/web/Dockerfile), which stamps
      # the favicon/manifest cache-busting query and the stale-shell-guard
      # version (issue #311): without this, every release from this compose
      # file built the same untagged bundle and the cache never refreshed.
      args:
        COWORK_VERSION: ${COWORK_VERSION:-dev}
    image: cowork-web:${COWORK_VERSION:-dev}
    restart: unless-stopped
    ports:
      - "${COWORK_PORT:-8021}:8021"
    environment:
      COWORK_DECISION_URL: ${COWORK_DECISION_URL:-}
      NOEVIA_FEATURE_STEP_SUPERVISION: ${NOEVIA_FEATURE_STEP_SUPERVISION:-}
      OCR_BASE_URL: http://ocr:8030
      UI_PORT: 8021
      # Separate optional listener; no port is published by default.
      COWORK_DAV_PORT: ${COWORK_DAV_PORT:-0}
      COWORK_DAV_SCOPE: ${COWORK_DAV_SCOPE:-}
      COWORK_DAV_ORIGIN: ${COWORK_DAV_ORIGIN:-}
      COWORK_DAV_PROXY_TOKEN: ${COWORK_DAV_PROXY_TOKEN:-}
      MEMBER_OUTBOUND_ORIGINS: ${MEMBER_OUTBOUND_ORIGINS:-}
      UI_AUTH_TOKEN: ${UI_AUTH_TOKEN:-}
      LEGACY_AUTH_COMPAT: ${LEGACY_AUTH_COMPAT:-false}
      PUBLIC_ORIGIN: ${PUBLIC_ORIGIN:-}
      WEBAUTHN_RP_ID: ${WEBAUTHN_RP_ID:-}
      ADDITIONAL_TRUSTED_ORIGINS: ${ADDITIONAL_TRUSTED_ORIGINS:-}
      TRUST_PROXY: ${TRUST_PROXY:-false}
      CORPUS_BACKEND: ${CORPUS_BACKEND:-local}
      CORPUS_ROOT: ${CORPUS_ROOT:-}
      WEBDAV_BASE_URL: ${WEBDAV_BASE_URL:-}
      WEBDAV_USERNAME: ${WEBDAV_USERNAME:-}
      WEBDAV_PASSWORD: ${WEBDAV_PASSWORD:-}
      DIARY_BASE_URL: http://diary:8010
      DIARY_AUTH_TOKEN: ${DIARY_AUTH_TOKEN:-}
      LLM_RATE_LIMIT: ${LLM_RATE_LIMIT:-60}
      INFERENCE_BASE_URL: ${INFERENCE_BASE_URL:-http://host.docker.internal:11434}
      INFERENCE_API_KEY: ${INFERENCE_API_KEY:-}
      DEFAULT_PROVIDER_ID: ${DEFAULT_PROVIDER_ID:-default}
      DEFAULT_PROVIDER_LABEL: ${DEFAULT_PROVIDER_LABEL:-Local inference}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-default}
      EMBEDDING_BASE_URL: ${EMBEDDING_BASE_URL:-}
      MODEL_MANAGER_KIND: ${MODEL_MANAGER_KIND:-none}
      MODEL_MANAGER_BASE_URL: ${MODEL_MANAGER_BASE_URL:-http://host.docker.internal:11434}
      MODEL_MANAGER_API_KEY: ${MODEL_MANAGER_API_KEY:-}
      LLAMACPP_PRESET_PATH: ${LLAMACPP_PRESET_PATH:-}
      # Optional MCP server (step 15). Empty = no MCP toolboxes, which is a
      # healthy state, not a degraded one.
      # One Nextcloud MCP server, the historical form.
      MCP_SERVER_URL: ${MCP_SERVER_URL:-}
      # Several servers: `id|url|auth` entries, comma separated. auth is
      # `nextcloud` (forward the user's Nextcloud app password) or `none`.
      # Omitting auth means none — a server never inherits the credential by
      # accident. Takes precedence over MCP_SERVER_URL when set.
      MCP_SERVERS: ${MCP_SERVERS:-}
      # Which curated toolboxes are offered in the picker. Unset offers all of
      # them; `core` is always offered. Curation decides what a box contains,
      # this decides whether anyone wants to see it.
      ENABLED_TOOLBOXES: ${ENABLED_TOOLBOXES:-}
      # Service tokens for MCP servers configured with `bearer:NAME`. The name
      # is referenced from MCP_SERVERS; the value lives here and never in a URL.
      TAVILY_API_KEY: ${TAVILY_API_KEY:-}
      # Origins that are the SAME Nextcloud the MCP server talks to. Only a
      # credential stored for one of these is ever forwarded. Empty = never.
      MCP_NEXTCLOUD_ORIGINS: ${MCP_NEXTCLOUD_ORIGINS:-}
      # noevia's own capabilities over MCP (Diary reads, project documents).
      # In-process second listener on loopback; 0 disables it entirely and is
      # the default. NEVER add this to `ports:` — it answers to a capability
      # token, not a session cookie. Pair it with an MCP_SERVERS entry:
      #   noevia|http://127.0.0.1:8022/mcp|internal
      MCP_INTERNAL_PORT: ${MCP_INTERNAL_PORT:-0}
      UI_DATA_DIR: /app/server/ui-data
    volumes:
      - ${COWORK_WEB_STORAGE:-${COWORK_STATE_DIR:-./state}/web}:/app/server/ui-data
    extra_hosts:
      - host.docker.internal:host-gateway
    depends_on:
      diary:
        condition: service_healthy

  ocr:
    build:
      context: ./services/ocr
    image: cowork-ocr:${OCR_VERSION:?Set OCR_VERSION to the built OCR image tag}
    restart: unless-stopped
    read_only: true
    mem_limit: 1g
    cpus: 1.0
    pids_limit: 64
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs:
      - /tmp:size=536870912,mode=1777
    networks: [ocr]

networks:
  laya:
    internal: true
  ocr:
    internal: true

# Selected by the guarded fresh-install initializer. Existing state binds remain
# the fallback when the storage overrides are absent or empty.
volumes:
  web-data:
  diary-data:
